plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

// Generar versión con timestamp
def timestamp = new Date().format("yyyyMMddHHmmss")
version = "1.0.${timestamp}"

// Cargo las variables automáticamente desde el .env (local)
def dotenvFile = file("$rootDir/.env")
def dotenvProps = new Properties()
if (dotenvFile.exists()) {
    dotenvFile.withReader { reader ->
        reader.eachLine { line ->
            line = line.trim()
            if (!line.startsWith("#") && line.contains("=")) {
                def (key, value) = line.split("=", 2)
                dotenvProps.setProperty(key.trim(), value.trim())
            }
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GitHubPackages'
        url = 'https://maven.pkg.github.com/Grupo-14-INGSIS/PrintScript-Tools'
        credentials {
            username = System.getenv("GITHUB_USER") ?: dotenvProps.getProperty("GITHUB_USER") ?: ""
            password = System.getenv("GITHUB_TOKEN") ?: dotenvProps.getProperty("GITHUB_TOKEN") ?: ""
        }
    }
}

dependencies {
    // Dependencias actualizadas con la última versión
    implementation 'IngsisTP:interpreter:1.1.202509160331296'
    implementation 'IngsisTP:lexer:1.1.202509160331296'
    implementation 'IngsisTP:linter:1.1.202509160331296'
    implementation 'IngsisTP:parser:1.1.202509160331296'
    implementation 'IngsisTP:formatter:1.1.202509160331296'
    implementation 'IngsisTP:ast:1.1.202509160331296'
    implementation 'IngsisTP:token:1.1.202509160331296'
    implementation 'IngsisTP:tokendata:1.1.202509160331296'
    implementation 'IngsisTP:container:1.1.202509160331296'
    implementation 'IngsisTP:executor:1.1.202509160331296'
    implementation 'IngsisTP:inputprovider:1.1.202509160331296'

    // Módulos opcionales que pueden ser útiles
    implementation 'IngsisTP:analyzer:1.1.202509160331296'
    implementation 'IngsisTP:formatteraction:1.1.202509160331296'
    implementation 'IngsisTP:progress:1.1.202509160331296'

    // Test dependencies
    testImplementation 'junit:junit:4.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'
}

// Para ejecutar el explorador de clases
application {
    mainClass = 'implementation.ClassExplorer'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.printscript'
            artifactId = 'printscript-tck'
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Grupo-14-INGSIS/PrintScript-TCK'
            credentials {
                username = System.getenv("GITHUB_USER") ?: dotenvProps.getProperty("GITHUB_USER") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: dotenvProps.getProperty("GITHUB_TOKEN") ?: ""
            }
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}